plugins {
    // Apply the scala Plugin to add support for Scala.
    id 'scala'

    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    implementation libs.scala.library
    implementation platform('org.apache.pekko:pekko-http-bom_2.13:1.4.1')
    implementation 'org.apache.pekko:pekko-http_2.13'
    implementation 'org.apache.pekko:pekko-actor-typed_2.13:1.7.1'
    implementation 'org.apache.pekko:pekko-stream_2.13:1.7.1'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.19.2'

    // Database access
    implementation 'com.typesafe.slick:slick_2.13:3.6.1'
    implementation 'com.zaxxer:HikariCP:6.3.0'
    implementation 'org.postgresql:postgresql:42.7.7'

    // Database migrations
    implementation 'org.flywaydb:flyway-core:11.10.5'
    implementation 'org.flywaydb:flyway-database-postgresql:11.10.5'

    // JSON serialization
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.19.2'
    implementation 'com.fasterxml.jackson.module:jackson-module-scala_2.13:2.19.2'

    // Password hashing and JWT auth
    implementation 'at.favre.lib:bcrypt:0.10.2'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Excel export
    implementation 'org.apache.poi:poi:5.4.0'
    implementation 'org.apache.poi:poi-ooxml:5.4.0'

    testImplementation libs.junit
    testImplementation libs.scalatest.v2.v13
    testImplementation libs.junit.v4.v13.v2.v13
    testImplementation 'org.apache.pekko:pekko-http-testkit_2.13'
    testImplementation 'org.apache.pekko:pekko-actor-testkit-typed_2.13:1.7.1'

    testRuntimeOnly libs.scala.xml.v2.v13
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.18'
}
// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

test {
    testLogging {
        events "passed", "skipped", "failed"
        showExceptions true
        exceptionFormat "full"
    }
}

application {
    // Define the main class for the application.
    mainClass = 'org.example.App'
}

tasks.register('hashPassword', JavaExec) {
    group = 'security'
    description = 'Generates a compatible BCrypt hash (cost factor 12) for a given password using PasswordService.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.example.auth.HashPasswordUtil'
    standardInput = System.in
}
